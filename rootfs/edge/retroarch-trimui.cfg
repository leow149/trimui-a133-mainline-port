# TrimUI Smart Pro overrides, loaded last on every start (retroarch.sh --appendconfig) so that
# RetroArch's save-on-exit of retroarch.cfg can't drift them.
video_driver = "vulkan"
video_context_driver = "wayland"
video_fullscreen = "true"
video_vsync = "true"
# The panel runs at 59.40 Hz (69 MHz / 880 x 1320). With the default 60 Hz RetroArch makes ~1 %
# too little audio for the rate the content really runs at, beyond what rate control (0.5 %)
# absorbs: constant audio underruns (stutter).
video_refresh_rate = "59.401"
video_rotation = "0"
screen_orientation = "0"
input_driver = "udev"
input_joypad_driver = "udev"
audio_driver = "alsa"
ui_companion_enable = "false"
ui_companion_start_on_boot = "false"
desktop_menu_enable = "false"
fps_show = "true"
