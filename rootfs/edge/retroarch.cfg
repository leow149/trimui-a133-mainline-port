# RetroArch on the TrimUI Smart Pro (mainline): Vulkan in a cage Wayland session
# (rootfs/root/wayland-session.sh), which turns the portrait panel to landscape.
video_driver = "vulkan"
video_context_driver = "wayland"
video_fullscreen = "true"
# Rotation: the display server is "null" on khr_display, so screen_orientation does nothing
# there and the menu ignores video_rotation; the compositor rotates instead.
video_rotation = "0"
screen_orientation = "0"
video_vsync = "true"
input_driver = "udev"
input_joypad_driver = "udev"
audio_driver = "alsa"
menu_driver = "ozone"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
system_directory = "/root/.config/retroarch/system"
savefile_directory = "/root/.config/retroarch/saves"
savestate_directory = "/root/.config/retroarch/states"
log_verbosity = "true"
# Alpine's build has the Qt desktop companion; without X11/Wayland it aborts RetroArch.
ui_companion_enable = "false"
ui_companion_start_on_boot = "false"
desktop_menu_enable = "false"
